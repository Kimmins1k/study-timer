<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>공부 링 타이머</title>
<style>
  :root { --bg: #f7f7f5; --card: #fff; --text: #1f1f1d; --sub: #6b6b66; --line: #e4e4df; --track: #e4e4df; --green: #1D9E75; --gray: #9a9a9a;
          --l1: #d4efe4; --l2: #8fd3b8; --l3: #3fb38a; --l4: #0f6e56; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1b; --card: #262625; --text: #ededea; --sub: #a3a39e; --line: #383836; --track: #383836;
            --l1: #1d3a30; --l2: #1f5c47; --l3: #1D9E75; --l4: #5DCAA5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", "Malgun Gothic", sans-serif; }
  nav { display: flex; gap: 4px; padding: 12px 16px 0; }
  nav button { flex: 1; padding: 8px; border: 0; border-radius: 8px; background: none; color: var(--sub); font: inherit; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--card); color: var(--text); font-weight: 600; }
  nav button:focus-visible, .main:focus-visible, .link:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  section { padding: 16px; }
  .ring { display: block; margin: 8px auto 0; }
  .total { text-align: center; font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 8px 0 0; }
  .state { text-align: center; color: var(--sub); margin: 0 0 16px; }
  .main { display: block; margin: 0 auto 20px; padding: 10px 40px; border: 0; border-radius: 999px; background: var(--green); color: #fff; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
  .main.on { background: var(--card); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  h2 { font-size: 13px; color: var(--sub); font-weight: 600; margin: 0 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li, summary { display: flex; justify-content: space-between; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  li.empty { color: var(--sub); justify-content: center; }
  details { margin-bottom: 4px; }
  summary { cursor: pointer; list-style: none; }
  details ul li { padding-left: 24px; color: var(--sub); background: var(--bg); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .link { border: 0; background: none; color: var(--text); font: inherit; font-size: 18px; padding: 4px 10px; cursor: pointer; border-radius: 6px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .grid .wd { text-align: center; font-size: 12px; color: var(--sub); }
  .day { aspect-ratio: 1; border-radius: 6px; background: var(--card); padding: 3px 5px; font-size: 11px; display: flex; flex-direction: column; justify-content: space-between; }
  .day b { font-weight: 600; font-size: 11px; align-self: flex-end; }
  .day.l1 { background: var(--l1); } .day.l2 { background: var(--l2); } .day.l3 { background: var(--l3); color: #fff; } .day.l4 { background: var(--l4); color: #fff; }
  .day.today { box-shadow: inset 0 0 0 2px var(--text); }
  .stats { display: flex; gap: 8px; margin-top: 16px; }
  .stats div { flex: 1; background: var(--card); border-radius: 8px; padding: 10px 12px; }
  .stats span { display: block; font-size: 12px; color: var(--sub); }
  .stats b { font-size: 18px; font-weight: 600; }
  .quit { display: block; margin: 0 auto 16px; border: 0; background: none; color: var(--sub); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<nav role="tablist">
  <button role="tab" data-tab="today" aria-selected="true">오늘</button>
  <button role="tab" data-tab="history" aria-selected="false">기록</button>
  <button role="tab" data-tab="month" aria-selected="false">월간</button>
</nav>

<section id="today">
  <svg class="ring" width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="80" fill="none" stroke="var(--track)" stroke-width="20"/>
    <circle id="arc" cx="100" cy="100" r="80" fill="none" stroke="var(--green)" stroke-width="20" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="0 503"/>
    <text id="hours" x="100" y="100" text-anchor="middle" dominant-baseline="central" font-size="56" font-weight="600" fill="var(--text)"></text>
  </svg>
  <p class="total" id="total">0:00:00</p>
  <p class="state" id="state">멈춤</p>
  <button class="main" id="toggle">시작</button>
  <h2>오늘 공부한 구간</h2>
  <ul id="segments"></ul>
</section>

<section id="history" hidden>
  <div id="days"></div>
</section>

<section id="month" hidden>
  <div class="bar">
    <button class="link" id="prev" aria-label="이전 달">‹</button>
    <strong id="monthLabel"></strong>
    <button class="link" id="next" aria-label="다음 달">›</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="stats">
    <div><span>이번 달 총</span><b id="monthTotal"></b></div>
    <div><span>하루 평균</span><b id="monthAvg"></b></div>
  </div>
</section>

<button class="quit" id="quit">프로그램 종료</button>
<script src="sessions.js"></script>
<script src="app.js"></script>
</body>
</html>
