<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  :root { --bg: rgba(255,255,255,0.88); --text: #1f1f1d; --track: rgba(128,128,128,0.35); }
  @media (prefers-color-scheme: dark) { :root { --bg: rgba(40,40,40,0.88); --text: #f2f2ef; } }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  button { all: unset; box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 12px;
           border-radius: 999px; background: var(--bg); color: var(--text); cursor: pointer;
           font: 600 16px "Segoe UI", "Malgun Gothic", sans-serif; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<button id="w" title="눌러서 상세 창 열기" aria-label="오늘 공부 시간. 눌러서 상세 창 열기">
  <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="9" fill="none" stroke="var(--track)" stroke-width="5"/>
    <circle id="arc" cx="12" cy="12" r="9" fill="none" stroke="#1D9E75" stroke-width="5" stroke-linecap="round" transform="rotate(-90 12 12)" stroke-dasharray="0 56.55"/>
  </svg>
  <span id="t">0:00:00</span>
</button>
<script src="sessions.js"></script>
<script src="widget.js"></script>
</body>
</html>
